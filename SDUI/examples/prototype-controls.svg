<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="570" viewBox="0 0 1020 570">
<title>SDUI button og input – statiske utseender</title>
<rect width="1020" height="570" fill="#edf1e8"/>
<text x="28" y="40" font-family="sans-serif" font-size="25" font-weight="bold" fill="#20302a">SDUI · begrenset prototypebibliotek</text>
<text x="28" y="72" font-family="sans-serif" font-size="15" font-weight="normal" fill="#20302a">Samme widgetbeskrivelse · SVG for Markdown · lokal HTML for utfylling</text>
<text x="28" y="119" font-family="sans-serif" font-size="14" font-weight="normal" fill="#20302a">Normal</text>
<svg x="28" y="135" width="222" height="40" data-widget="button" data-path="controls/$r0c1/ok"><title>OK</title><rect x="1" y="4" width="220" height="33" rx="5" fill="#9aaa9d"/><rect x="1" y="1" width="220" height="33" rx="5" fill="#f3f6f0" stroke="#9aaa9d"/><text x="111.0" y="23" text-anchor="middle" fill="#20302a" font-family="sans-serif" font-size="14">OK</text></svg>
<text x="274" y="119" font-family="sans-serif" font-size="14" font-weight="normal" fill="#20302a">Trykket</text>
<svg x="274" y="135" width="222" height="40" data-widget="button" data-path="controls/$r0c1/pressed"><title>Trykket</title><rect x="1" y="4" width="220" height="33" rx="5" fill="#9aaa9d"/><rect x="1" y="3" width="220" height="33" rx="5" fill="#d6e4d5" stroke="#9aaa9d"/><text x="111.0" y="25" text-anchor="middle" fill="#20302a" font-family="sans-serif" font-size="14">Trykket</text></svg>
<text x="520" y="119" font-family="sans-serif" font-size="14" font-weight="normal" fill="#20302a">Fokus</text>
<svg x="520" y="135" width="222" height="40" data-widget="button" data-path="controls/$r0c1/cancel"><title>Avbryt</title><rect x="1" y="4" width="220" height="33" rx="5" fill="#9aaa9d"/><rect x="1" y="1" width="220" height="33" rx="5" fill="#f3f6f0" stroke="#9aaa9d"/><text x="111.0" y="23" text-anchor="middle" fill="#20302a" font-family="sans-serif" font-size="14">Avbryt</text><rect x="3" y="3" width="216" height="31" rx="4" fill="none" stroke="#3975b0" stroke-dasharray="3 2"/></svg>
<text x="766" y="119" font-family="sans-serif" font-size="14" font-weight="normal" fill="#20302a">Deaktivert</text>
<svg x="766" y="135" width="222" height="40" data-widget="button" data-path="controls/$r0c1/disabled"><title>Utilgjengelig</title><rect x="1" y="4" width="220" height="33" rx="5" fill="#9aaa9d"/><rect x="1" y="1" width="220" height="33" rx="5" fill="#ecefe9" stroke="#9aaa9d"/><text x="111.0" y="23" text-anchor="middle" fill="#65776d" font-family="sans-serif" font-size="14">Utilgjengelig</text></svg>
<svg x="28" y="227" width="456" height="66" data-widget="input" data-path="controls/$r0c1/operator"><title>Operatør: Ola Nordmann</title><text x="0" y="15" fill="#20302a" font-family="sans-serif" font-size="14">Operatør</text><rect x="1" y="24" width="454" height="36" rx="4" fill="#ffffff" stroke="#9aaa9d" stroke-width="1"/><svg x="10" y="25" width="436" height="34"><text x="0" y="23" fill="#20302a" font-family="sans-serif" font-size="14">Ola Nordmann</text></svg></svg>
<svg x="526" y="227" width="456" height="66" data-widget="input" data-path="controls/$r0c1/stemId"><title>Stamme-ID: GRAN-0042</title><text x="0" y="15" fill="#20302a" font-family="sans-serif" font-size="14">Stamme-ID</text><rect x="1" y="24" width="454" height="36" rx="4" fill="#ffffff" stroke="#3975b0" stroke-width="2"/><svg x="10" y="25" width="436" height="34"><text x="0" y="23" fill="#20302a" font-family="sans-serif" font-size="14">GRAN-0042</text></svg></svg>
<svg x="28" y="340" width="954" height="66" data-widget="input" data-path="controls/$r0c1/note"><title>Merknad: Kontroller barkmåling før neste kapp</title><text x="0" y="15" fill="#20302a" font-family="sans-serif" font-size="14">Merknad</text><rect x="1" y="24" width="952" height="36" rx="4" fill="#ffffff" stroke="#9aaa9d" stroke-width="1"/><svg x="10" y="25" width="934" height="34"><text x="0" y="23" fill="#20302a" font-family="sans-serif" font-size="14">Kontroller barkmåling før neste kapp</text></svg></svg>
<text x="28" y="461" font-family="sans-serif" font-size="16" font-weight="normal" fill="#20302a">SVG-bildet er statisk. Åpne HTML-demoen for å skrive og prøve knapper.</text>
<text x="28" y="500" font-family="sans-serif" font-size="15" font-weight="normal" fill="#20302a">Utskrift bruker feltverdiene som står i HTML-demoen når du skriver ut.</text>
</svg>
