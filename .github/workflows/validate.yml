name: Validate SDP Toolkit

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r Toolkit/tests/requirements.txt
      - run: python Toolkit/scripts/validate_sdp.py --base-ref origin/main
      - run: python SDP/ProjectManagement/validate.py
      - run: python -m unittest discover -s Toolkit/tests -p "test_*.py" -v

  go-installation-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - run: go -C SDPTool/bootstrap test -race -count=1 ./...
      - run: go -C SDPTool test -race -count=1 ./...
      - run: SDPTool/package.sh build/go-installer
      - name: Signed test descriptor and actual packaged child
        env:
          SDP_TEST_BINARY: ${{ github.workspace }}/build/go-installer/sdptool
        run: go -C SDPTool test ./install -run TestPackagedSignedInstall -count=1 -v

      - name: Build the current Go release descriptor
        run: go -C SDPTool run ./tools/profile --repo .. --output "$RUNNER_TEMP/sdp-development.json" --source-commit "$GITHUB_SHA" --release development-ci --binary ../build/go-installer/sdptool
      - name: Reject retired executable entry points
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(ps1|psm1|psd1)$'; then
            echo "Retired shell installer found in source inventory" >&2
            exit 1
          fi
